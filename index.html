<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>DualView</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#fff}header{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#14171b;position:sticky;top:0;z-index:5}header strong{flex:1}.btn{border:0;border-radius:10px;background:#262b31;color:#fff;padding:10px 12px;font-weight:650;min-height:42px}.btn.primary{background:#fff;color:#111}.btn:disabled{opacity:.45}.grid{display:grid;grid-template-columns:1fr;gap:6px;padding:6px}.pane{position:relative;background:#000;border-radius:12px;overflow:hidden;min-height:230px}.pane video{width:100%;height:100%;min-height:230px;object-fit:contain;background:#000;display:block}.badge{position:absolute;top:8px;left:8px;background:#000b;padding:5px 8px;border-radius:8px;font-size:12px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;gap:6px;position:absolute;bottom:8px;left:8px;right:8px;flex-wrap:wrap}.controls .btn{background:#111d;backdrop-filter:blur(8px);padding:8px 10px}.setup{padding:12px;display:grid;gap:12px}.card{display:grid;gap:9px;background:#15191e;border:1px solid #2a3037;border-radius:14px;padding:12px}.field{display:grid;gap:6px}.field label{font-size:13px;color:#b9c0c8}.row{display:flex;gap:8px}.row input,.field select{width:100%;min-width:0;border:1px solid #343a41;background:#0f1216;color:#fff;border-radius:10px;padding:12px;font-size:16px}.row input{flex:1}.hint{color:#9ca4ad;font-size:13px;line-height:1.4}.status{min-height:18px;color:#c9d1d9;font-size:13px}.hidden{display:none!important}.single .pane:not(.active){display:none}.channel-row{display:grid;grid-template-columns:1fr;gap:7px}.search{border:1px solid #343a41;background:#0f1216;color:#fff;border-radius:10px;padding:11px;font-size:16px;width:100%}@media (orientation:landscape){header{padding:6px 10px}.setup{grid-template-columns:1fr 1fr;padding:8px}.setup .playlist-card{grid-column:1/-1}.grid{grid-template-columns:1fr 1fr;height:calc(100dvh - 54px)}.pane,.pane video{min-height:0;height:100%}body.player .setup{display:none}}@media (min-width:800px){.grid{grid-template-columns:1fr 1fr}.channel-row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <strong>DualView <span style="font-size:12px;color:#9ca4ad">v2</span></strong>
  <button class="btn" id="swap" type="button">Swap</button>
  <button class="btn" id="setupBtn" type="button">Channels</button>
  <button class="btn primary" id="playBoth" type="button" disabled>Play both</button>
</header>

<section class="setup" id="setup">
  <div class="card playlist-card">
    <div class="field">
      <label for="playlistUrl">Uzzu app2 playlist URL</label>
      <div class="row">
        <input id="playlistUrl" inputmode="url" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="https://uzzu.tv/app2/your-email">
        <button class="btn primary" id="importBtn" type="button">Import</button>
      </div>
    </div>
    <div class="hint">Your playlist address stays in this browser on this device. Do not share it publicly. DualView imports the M3U channel list and plays the selected HLS streams directly.</div>
    <div class="status" id="status" aria-live="polite">Enter your app2 playlist URL to begin.</div>
  </div>

  <div class="card">
    <div class="field">
      <label for="search1">Game 1</label>
      <input class="search" id="search1" type="search" placeholder="Search channels or teams" disabled>
      <select id="channel1" disabled><option>Import playlist first</option></select>
    </div>
    <button class="btn" id="load1" type="button" disabled>Load Game 1</button>
  </div>

  <div class="card">
    <div class="field">
      <label for="search2">Game 2</label>
      <input class="search" id="search2" type="search" placeholder="Search channels or teams" disabled>
      <select id="channel2" disabled><option>Import playlist first</option></select>
    </div>
    <button class="btn" id="load2" type="button" disabled>Load Game 2</button>
  </div>
</section>

<main class="grid" id="grid">
  <section class="pane active" data-pane="1">
    <video id="v1" playsinline controls preload="metadata"></video>
    <span class="badge" id="badge1">GAME 1</span>
    <div class="controls"><button class="btn" data-mute="1" type="button">Mute</button><button class="btn" data-max="1" type="button">Maximize</button></div>
  </section>
  <section class="pane" data-pane="2">
    <video id="v2" playsinline controls preload="metadata"></video>
    <span class="badge" id="badge2">GAME 2</span>
    <div class="controls"><button class="btn" data-mute="2" type="button">Mute</button><button class="btn" data-max="2" type="button">Maximize</button></div>
  </section>
</main>

<script>
(()=>{
  const $=s=>document.querySelector(s);
  const v=[null,$('#v1'),$('#v2')];
  const selects=[null,$('#channel1'),$('#channel2')];
  const searches=[null,$('#search1'),$('#search2')];
  const badges=[null,$('#badge1'),$('#badge2')];
  const grid=$('#grid'), status=$('#status'), playBoth=$('#playBoth');
  let channels=[];

  function msg(t){status.textContent=t}
  function safeUrl(x){try{const u=new URL(x);return /^https?:$/.test(u.protocol)?u.toString():''}catch{return ''}}
  function parseM3U(text){
    const lines=text.replace(/\r/g,'').split('\n');
    const out=[]; let meta=null;
    for(const raw of lines){
      const line=raw.trim(); if(!line) continue;
      if(line.startsWith('#EXTINF:')){
        const comma=line.lastIndexOf(',');
        const name=(comma>=0?line.slice(comma+1):'Channel').trim()||'Channel';
        const group=(line.match(/group-title="([^"]*)"/i)||[])[1]||'';
        const logo=(line.match(/tvg-logo="([^"]*)"/i)||[])[1]||'';
        meta={name,group,logo};
      }else if(!line.startsWith('#') && meta){
        const url=safeUrl(line); if(url) out.push({...meta,url}); meta=null;
      }
    }
    return out;
  }
  function fill(i,query=''){
    const sel=selects[i], current=sel.value, q=query.trim().toLowerCase();
    sel.innerHTML='';
    const filtered=channels.filter(c=>!q || (c.name+' '+c.group).toLowerCase().includes(q));
    if(!filtered.length){const o=document.createElement('option');o.textContent='No matches';o.value='';sel.appendChild(o);return}
    filtered.forEach(c=>{const o=document.createElement('option');o.value=c.url;o.textContent=(c.group?c.group+' — ':'')+c.name;o.dataset.name=c.name;sel.appendChild(o)});
    if([...sel.options].some(o=>o.value===current)) sel.value=current;
  }
  async function importPlaylist(){
    const url=safeUrl($('#playlistUrl').value.trim());
    if(!url){msg('Enter a valid https:// app2 playlist URL.');return}
    $('#importBtn').disabled=true; msg('Importing playlist…');
    try{
      const res=await fetch(url,{cache:'no-store',credentials:'omit'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const text=await res.text();
      const parsed=parseM3U(text);
      if(!parsed.length) throw new Error('No playable channels were found in the playlist.');
      channels=parsed;
      for(let i=1;i<=2;i++){searches[i].disabled=false;selects[i].disabled=false;fill(i,'')}
      $('#load1').disabled=false;$('#load2').disabled=false;playBoth.disabled=false;
      try{localStorage.setItem('dualview_playlist_url',url)}catch{}
      msg('Imported '+channels.length+' channels. Pick Game 1 and Game 2.');
    }catch(e){
      console.error(e);
      msg('Playlist import was blocked or failed. If the URL works in Web Video Cast but not here, Uzzu may be blocking browser cross-origin access.');
    }finally{$('#importBtn').disabled=false}
  }
  function selectedName(i){const o=selects[i].selectedOptions[0];return o?.dataset?.name||o?.textContent||('GAME '+i)}
  function load(i){const url=selects[i].value;if(!url){msg('Choose a channel for Game '+i+'.');return}v[i].src=url;v[i].load();badges[i].textContent=selectedName(i);msg('Game '+i+' loaded: '+selectedName(i));}

  $('#importBtn').addEventListener('click',importPlaylist);
  $('#load1').addEventListener('click',()=>load(1)); $('#load2').addEventListener('click',()=>load(2));
  for(let i=1;i<=2;i++) searches[i].addEventListener('input',()=>fill(i,searches[i].value));

  playBoth.addEventListener('click',async()=>{
    if(!v[1].src) load(1); if(!v[2].src) load(2);
    document.body.classList.add('player'); let ok=0;
    for(let i=1;i<=2;i++){try{await v[i].play();ok++}catch(e){console.warn(e)}}
    msg(ok===2?'Both streams are playing.':'iOS blocked one or both starts. Tap Play on each video once, then tap Play both again.');
  });
  document.querySelectorAll('[data-mute]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.mute;v[i].muted=!v[i].muted;b.textContent=v[i].muted?'Unmute':'Mute'}));
  document.querySelectorAll('[data-max]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.max,p=document.querySelector('[data-pane="'+i+'"]');grid.classList.toggle('single');document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));p.classList.add('active');b.textContent=grid.classList.contains('single')?'Split view':'Maximize'}));
  $('#swap').addEventListener('click',()=>{const a=document.querySelector('[data-pane="1"]'),b=document.querySelector('[data-pane="2"]');grid.insertBefore(b,a)});
  $('#setupBtn').addEventListener('click',()=>{$('#setup').classList.toggle('hidden');document.body.classList.remove('player')});
  for(let i=1;i<=2;i++) v[i].addEventListener('error',()=>msg('Game '+i+' could not load. Try another channel or re-import the playlist.'));
  try{const saved=localStorage.getItem('dualview_playlist_url');if(saved)$('#playlistUrl').value=saved}catch{}
  if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
